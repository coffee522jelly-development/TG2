    function saveHistory() {
        if (historyIndex < historyStack.length - 1) {
            historyStack = historyStack.slice(0, historyIndex + 1);
        }
        historyStack.push({
            layers: JSON.parse(JSON.stringify(layers)),

        });
        historyIndex++;
        updateHistoryButtons();

    }

    function restoreHistory(index) {
        if (index < 0 || index >= historyStack.length) return;
        historyIndex = index;

        layers = JSON.parse(JSON.stringify(snapshot.layers));
        shapes = JSON.parse(JSON.stringify(snapshot.shapes));

    function buildThreeScene() {
        while(tScene.children.length > 0){ tScene.remove(tScene.children[0]); }

        shapes.forEach((shape, idx) => {
            if (!shape.visible) return;
            let geometry;
            const mat = new THREE.MeshBasicMaterial({ color: shape.color, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });

            if (shape.type === 'circle') {
                geometry = new THREE.CircleGeometry(shape.radius, 64);
            } else if (shape.type === 'rect') {
                const s = shape.radius * 2;
                geometry = new THREE.PlaneGeometry(s, s);
            } else if (shape.type === 'sector') {
                const rad = (shape.angle * Math.PI) / 180;
                geometry = new THREE.CircleGeometry(shape.radius, 64, 0, rad);
            } else if (shape.type === 'triangle') {
                const s = shape.radius * 2; const h = s * Math.sqrt(3) / 2;
                const tShape = new THREE.Shape(); tShape.moveTo(0, h/2); tShape.lineTo(-s/2, -h/2); tShape.lineTo(s/2, -h/2); tShape.closePath();
                geometry = new THREE.ShapeGeometry(tShape);
            } else if (shape.type === 'ring') {
                geometry = new THREE.RingGeometry(shape.radius * 0.5, shape.radius, 64);
            } else if (shape.type === 'star') {
                const sShape = new THREE.Shape();
                const outer = shape.radius;
                const inner = shape.radius * 0.4;
                for(let j=0; j<10; j++) {
                    const r = j%2===0 ? outer : inner;
                    const a = (j * Math.PI)/5 - Math.PI/2;
                    if(j===0) sShape.moveTo(r*Math.cos(a), r*Math.sin(a));
                    else sShape.lineTo(r*Math.cos(a), r*Math.sin(a));
                }
                sShape.closePath();
                geometry = new THREE.ShapeGeometry(sShape);
            } else if (shape.type === 'line') {
                const length = shape.radius * 2; const thick = shape.thick || 5;
                const lShape = new THREE.Shape(); lShape.moveTo(0, -thick/2); lShape.lineTo(length, -thick/2); lShape.lineTo(length, thick/2); lShape.lineTo(0, thick/2); lShape.closePath();
                geometry = new THREE.ShapeGeometry(lShape);
            }

            if (geometry) {
                const mesh = new THREE.Mesh(geometry, mat);
                const zPos = (shape.isFront ? 10 : 0) + (idx * 0.01);
                mesh.position.set(shape.posX, shape.posY, zPos);
                if (shape.type === 'line' && shape.angle) mesh.rotation.z = (shape.angle * Math.PI) / 180;
                tScene.add(mesh);
            }
        });
    }

                <div class="flex justify-between items-center font-mono font-bold text-[10px] cursor-pointer" onclick="setActiveLayer('shape', ${shape.id})">
                    <div class="flex items-center gap-0.5">
                        <select class="shape-type-select bg-slate-200 dark:bg-slate-700 text-[#1e293b] dark:text-white px-1 py-0.5 border-none outline-none font-bold cursor-pointer" onclick="event.stopPropagation()">
                            <option value="circle" ${shape.type==='circle'?'selected':''}>CIRCLE</option>
                            <option value="rect" ${shape.type==='rect'?'selected':''}>RECT</option>
                            <option value="triangle" ${shape.type==='triangle'?'selected':''}>TRIANGLE</option>
                            <option value="sector" ${shape.type==='sector'?'selected':''}>SECTOR</option>
                            <option value="ring" ${shape.type==='ring'?'selected':''}>RING</option>
                            <option value="star" ${shape.type==='star'?'selected':''}>STAR</option>
                            <option value="line" ${shape.type==='line'?'selected':''}>LINE</option>
                        </select>
                        <span class="opacity-50 ml-1">_0${idx+1}</span>
                    </div>
                    <div class="flex gap-1">
                        <button class="p-0.5 hover:bg-slate-200 dark:bg-slate-700" onclick="toggleShapeVisibility(${shape.id}, event)"><i data-feather="${shape.visible?'eye':'eye-off'}" class="w-3 h-3"></i></button>
                        <button class="p-0.5 hover:bg-red-100 dark:hover:bg-red-900/40 hover:text-red-500" onclick="deleteShape(${shape.id}, event)"><i data-feather="trash-2" class="w-3 h-3"></i></button>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-1">
                    <div class="flex gap-1.5 items-center font-mono text-[10px]">
                        <input type="color" class="shape-color-input w-5 h-[18px] border border-slate-300 dark:border-slate-700 bg-transparent cursor-pointer" value="${shape.color}">
                        ${uniqueCtrl}
                    </div>
                    <label class="flex items-center gap-0.5 cursor-pointer font-mono text-[9px] opacity-80 bg-slate-100 dark:bg-[#0f172a] px-1 py-0.5 rounded-sm border border-slate-200 dark:border-slate-700" onclick="event.stopPropagation()">
                        <input type="checkbox" class="shape-front-check accent-emerald-500" ${shape.isFront?'checked':''}> FRONT
                    </label>
                </div>
                <div class="flex justify-end gap-1.5 mt-0.5 font-mono text-[10px] opacity-60">
                    <span>X:<input type="number" class="shape-x-input bg-transparent w-8 border-b border-transparent hover:border-slate-400 focus:border-emerald-500 text-right font-mono" value="${shape.posX}"></span>
                    <span>Y:<input type="number" class="shape-y-input bg-transparent w-8 border-b border-transparent hover:border-slate-400 focus:border-emerald-500 text-right font-mono" value="${shape.posY}"></span>
                </div>
            `;

            item.querySelector('.shape-type-select').addEventListener('change', (e) => { shape.type = e.target.value; renderShapeList(); drawThumbnail(); saveHistory(); });
            item.querySelector('.shape-front-check').addEventListener('change', (e) => { shape.isFront = e.target.checked; drawThumbnail(); saveHistory(); });
            item.querySelector('.shape-color-input').addEventListener('change', (e) => { shape.color = e.target.value; drawThumbnail(); saveHistory(); });
            if(item.querySelector('.shape-r-input')) item.querySelector('.shape-r-input').addEventListener('change', (e) => { shape.radius = parseInt(e.target.value) || 10; drawThumbnail(); saveHistory(); });
            if(item.querySelector('.shape-a-input')) item.querySelector('.shape-a-input').addEventListener('change', (e) => { shape.angle = parseInt(e.target.value) || 0; drawThumbnail(); saveHistory(); });
            if(item.querySelector('.shape-t-input')) item.querySelector('.shape-t-input').addEventListener('change', (e) => { shape.thick = parseInt(e.target.value) || 1; drawThumbnail(); saveHistory(); });
            item.querySelector('.shape-x-input').addEventListener('change', (e) => { shape.posX = parseInt(e.target.value) || 0; drawThumbnail(); saveHistory(); });
            item.querySelector('.shape-y-input').addEventListener('change', (e) => { shape.posY = parseInt(e.target.value) || 0; drawThumbnail(); saveHistory(); });

            shapeListContainer.appendChild(item);
        });
        feather.replace();
    }

    function renderLayerList() {
        layerListContainer.innerHTML = '';
        layers.forEach((layer, idx) => {
            const item = document.createElement('div');
            const isActive = activeLayerType === 'text' && layer.id === activeLayerId;
            item.className = `p-2 border border-slate-300 dark:border-slate-700 flex flex-col gap-1.5 transition-all ${isActive ? 'border-l-2 border-l-blue-500 bg-white dark:bg-[#1e293b] shadow-sm' : 'border-l border-l-slate-300 dark:border-l-slate-700 bg-slate-50 dark:bg-[#1e293b]/40'}`;
            item.dataset.id = layer.id;

            const fontOptions = `
                <optgroup label="TECHNICAL / SANS">
                    <option value="'Oswald', sans-serif" ${layer.fontFamily==="'Oswald', sans-serif"?'selected':''}>Oswald</option>
                    <option value="'Noto Sans JP', sans-serif" ${layer.fontFamily==="'Noto Sans JP', sans-serif"?'selected':''}>Noto Sans JP</option>
                    <option value="'Montserrat', sans-serif" ${layer.fontFamily==="'Montserrat', sans-serif"?'selected':''}>Montserrat</option>
                    <option value="'M PLUS 1p', sans-serif" ${layer.fontFamily==="'M PLUS 1p', sans-serif"?'selected':''}>M PLUS 1p</option>
                </optgroup>
                <optgroup label="SERIF / CLASSIC">
                    <option value="'Playfair Display', serif" ${layer.fontFamily==="'Playfair Display', serif"?'selected':''}>Playfair Display</option>
                    <option value="'Shippori Mincho', serif" ${layer.fontFamily==="'Shippori Mincho', serif"?'selected':''}>Shippori Mincho</option>
                    <option value="'Noto Serif JP', serif" ${layer.fontFamily==="'Noto Serif JP', serif"?'selected':''}>Noto Serif JP</option>
                </optgroup>
            `;

            item.innerHTML = `
                <div class="flex justify-between items-center font-mono font-bold text-[10px] cursor-pointer" onclick="setActiveLayer('text', ${layer.id})">
                    <span class="opacity-70">TEXT_0${idx + 1}</span>
                    <div class="flex gap-1">
                        <button class="p-0.5 hover:bg-slate-200 dark:hover:bg-slate-700" onclick="toggleVisibility(${layer.id}, event)"><i data-feather="${layer.visible ? 'eye' : 'eye-off'}" class="w-3 h-3"></i></button>
                        <button class="p-0.5 hover:bg-red-100 dark:hover:bg-red-900/40 hover:text-red-500" onclick="deleteLayer(${layer.id}, event)"><i data-feather="trash-2" class="w-3 h-3"></i></button>
                    </div>
                </div>
                <div>
                    <textarea class="layer-text-input w-full bg-white dark:bg-[#0f172a] border border-slate-300 dark:border-slate-700 px-1.5 py-1 outline-none text-[11px] font-mono leading-tight focus:border-blue-500">${layer.text}</textarea>
                </div>
                <div class="grid grid-cols-12 gap-1.5 items-center">
                    <select class="layer-font-select col-span-7 bg-white dark:bg-[#0f172a] border border-slate-300 dark:border-slate-700 px-1 py-0.5 outline-none text-[11px] focus:border-blue-500">${fontOptions}</select>
                    <input type="number" class="layer-size-input col-span-3 bg-white dark:bg-[#0f172a] border border-slate-300 dark:border-slate-700 px-1 py-0.5 outline-none font-mono text-[11px] text-center" value="${layer.fontSize}">
                    <input type="color" class="layer-color-input col-span-2 w-full h-[22px] p-0 border border-slate-300 dark:border-slate-700 bg-transparent cursor-pointer" value="${layer.textColor}">
                </div>
                <div class="flex justify-between items-center mt-0.5 pt-1 border-t border-slate-200 dark:border-slate-700/60 font-mono text-[10px]">
                    <div class="flex gap-2 opacity-80">
                        <label class="flex items-center gap-0.5 cursor-pointer"><input type="checkbox" class="layer-bold-check accent-blue-500" ${layer.isBold?'checked':''}>B</label>
                        <label class="flex items-center gap-0.5 cursor-pointer"><input type="checkbox" class="layer-italic-check accent-blue-500" ${layer.isItalic?'checked':''}>I</label>
                        <label class="flex items-center gap-0.5 cursor-pointer"><input type="checkbox" class="layer-underline-check accent-blue-500" ${layer.isUnderline?'checked':''}>U</label>
                    </div>
                    <div class="opacity-60 flex gap-1.5">
                        <span>X:<input type="number" class="layer-x-input bg-transparent w-7 border-b border-transparent hover:border-slate-400 focus:border-blue-500 text-right font-mono" value="${layer.posX}"></span>
                        <span>Y:<input type="number" class="layer-y-input bg-transparent w-7 border-b border-transparent hover:border-slate-400 focus:border-blue-500 text-right font-mono" value="${layer.posY}"></span>
                    </div>
                </div>
            `;

            item.querySelector('.layer-text-input').addEventListener('input', (e) => { layer.text = e.target.value; drawThumbnail(); });
            item.querySelector('.layer-text-input').addEventListener('change', () => { saveHistory(); });
            item.querySelector('.layer-font-select').addEventListener('change', (e) => { layer.fontFamily = e.target.value; drawThumbnail(); saveHistory(); });
            item.querySelector('.layer-size-input').addEventListener('input', (e) => { layer.fontSize = parseInt(e.target.value) || 20; drawThumbnail(); });
            item.querySelector('.layer-size-input').addEventListener('change', () => { saveHistory(); });
            item.querySelector('.layer-color-input').addEventListener('change', (e) => { layer.textColor = e.target.value; drawThumbnail(); saveHistory(); });
            item.querySelector('.layer-bold-check').addEventListener('change', (e) => { layer.isBold = e.target.checked; drawThumbnail(); saveHistory(); });
            item.querySelector('.layer-italic-check').addEventListener('change', (e) => { layer.isItalic = e.target.checked; drawThumbnail(); saveHistory(); });
            item.querySelector('.layer-underline-check').addEventListener('change', (e) => { layer.isUnderline = e.target.checked; drawThumbnail(); saveHistory(); });
            item.querySelector('.layer-x-input').addEventListener('change', (e) => { layer.posX = parseInt(e.target.value) || 0; drawThumbnail(); saveHistory(); });
            item.querySelector('.layer-y-input').addEventListener('change', (e) => { layer.posY = parseInt(e.target.value) || 0; drawThumbnail(); saveHistory(); });

            layerListContainer.appendChild(item);
        });
        feather.replace();
    }

    function setActiveLayer(type, id) {
        activeLayerType = type; activeLayerId = id;
        renderLayerList(); renderShapeList(); drawThumbnail();
    }

    addShapeSelect.addEventListener('change', (e) => {
        const type = e.target.value; if(!type) return;
        const newId = shapes.length > 0 ? Math.max(...shapes.map(s => s.id)) + 1 : 1;
        shapes.push({ id: newId, type: type, radius: 100, angle: 90, color: '#3b82f6', posX: 0, posY: 0, visible: true, thick: 6, isFront: false });
        activeLayerType = 'shape'; activeLayerId = newId;
        addShapeSelect.value = '';
        renderShapeList(); drawThumbnail(); saveHistory();
    });

    function toggleShapeVisibility(id, event) {
        event.stopPropagation(); const s = shapes.find(x => x.id === id);
        if(s) { s.visible = !s.visible; renderShapeList(); drawThumbnail(); saveHistory(); }
    }
    function deleteShape(id, event) {
        event.stopPropagation(); shapes = shapes.filter(x => x.id !== id);
        if(activeLayerType === 'shape' && activeLayerId === id) activeLayerId = shapes.length > 0 ? shapes[0].id : 1;
        renderShapeList(); drawThumbnail(); saveHistory();
    }
    function toggleVisibility(id, event) {
        event.stopPropagation(); const l = layers.find(x => x.id === id);
        if(l) { l.visible = !l.visible; renderLayerList(); drawThumbnail(); saveHistory(); }
    }
    function deleteLayer(id, event) {
        event.stopPropagation(); if (layers.length <= 1) return;
        layers = layers.filter(x => x.id !== id);
        if(activeLayerType === 'text' && activeLayerId === id) activeLayerId = layers[0].id;
        renderLayerList(); drawThumbnail(); saveHistory();
    }

    addLayerBtn.addEventListener('click', () => {
        const newId = layers.length > 0 ? Math.max(...layers.map(l => l.id)) + 1 : 1;
        layers.push({ id: newId, text: "NEW NODE ELEMENT", fontFamily: "'Oswald', sans-serif", fontSize: 32, textColor: "#ffffff", isBold: false, isItalic: false, isUnderline: false, posX: 0, posY: 0, visible: true });
        activeLayerType = 'text'; activeLayerId = newId;
        renderLayerList(); drawThumbnail(); saveHistory();
    });

    bgColorInput.addEventListener('input', (e) => { bgColorTextInput.value = e.target.value; drawThumbnail(); });
    bgColorInput.addEventListener('change', () => { saveHistory(); });
    bgColorTextInput.addEventListener('change', (e) => {
        if(/^#[0-9A-F]{6}$/i.test(e.target.value)) {
            bgColorInput.value = e.target.value; drawThumbnail(); saveHistory();
        }
    });

    fileNameInput.addEventListener('change', () => { saveToLocalStorage(); });

    [canvasWidthInput, canvasHeightInput, gridDivXInput, gridDivYInput].forEach(input => {
        input.addEventListener('change', () => { drawThumbnail(); saveHistory(); });
    });

    presetSelect.addEventListener('change', (e) => {
        const presetIndex = parseInt(e.target.value);
        if (isNaN(presetIndex) || !presets[presetIndex]) return;

        if (confirm('プリセットを適用しますか？現在の編集内容は上書きされます。')) {
            const preset = presets[presetIndex];

            layers = JSON.parse(JSON.stringify(preset.layers));
            shapes = JSON.parse(JSON.stringify(preset.shapes));

            canvasWidthInput.value = preset.canvasWidth;
            canvasHeightInput.value = preset.canvasHeight;
            bgColorInput.value = preset.bgColor;
            bgColorTextInput.value = preset.bgColor;
            gridDivXInput.value = preset.gridDivX;
            gridDivYInput.value = preset.gridDivY;

            activeLayerType = 'text';
            activeLayerId = layers.length > 0 ? layers[0].id : null;

            renderLayerList();
            renderShapeList();
            drawThumbnail();
            saveHistory();
        } else {
            e.target.value = "";
        }
    });

    resetBtn.addEventListener('click', () => {
        if (confirm('プロジェクトを初期化しますか？保存されたデータは完全に消去されます。')) {
            localStorage.removeItem('cadThumbnailGenState');
            location.reload();
        }
    });

    function drawThumbnail() {
        const width = parseInt(canvasWidthInput.value) || 1200;
        const height = parseInt(canvasHeightInput.value) || 630;

        const divX = Math.max(1, parseInt(gridDivXInput.value) || 12);
        const divY = Math.max(1, parseInt(gridDivYInput.value) || 12);
        const stepX = width / divX;
        const stepY = height / divY;

        canvas.width = width;
        canvas.height = height;

        ctx.fillStyle = bgColorInput.value;
        ctx.fillRect(0, 0, width, height);

        if (isDragging) {
            ctx.save();
            ctx.strokeStyle = "rgba(148, 163, 184, 0.25)"; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
            for (let i = 1; i < divX; i++) { ctx.beginPath(); ctx.moveTo(i * stepX, 0); ctx.lineTo(i * stepX, height); ctx.stroke(); }
            for (let j = 1; j < divY; j++) { ctx.beginPath(); ctx.moveTo(0, j * stepY); ctx.lineTo(width, j * stepY); ctx.stroke(); }
            ctx.restore();
        }

        buildThreeScene();
        tCamera.left = -width / 2; tCamera.right = width / 2; tCamera.top = height / 2; tCamera.bottom = -height / 2;
        tCamera.updateProjectionMatrix();
        tRenderer.setSize(width, height);

        tScene.children.forEach(mesh => { mesh.visible = mesh.position.z < 5; });
        tRenderer.clear();
        tRenderer.render(tScene, tCamera);
        ctx.drawImage(threeCanvas, 0, 0);

        layers.forEach(layer => {
            if (!layer.visible) return;

            ctx.save();
            let fontStyle = '';
            if (layer.isItalic) fontStyle += 'italic ';
            if (layer.isBold) fontStyle += 'bold ';
            fontStyle += `${layer.fontSize}px ${layer.fontFamily}`;
            ctx.font = fontStyle;
            ctx.fillStyle = layer.textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const lines = layer.text.split('\n');
            const lineHeight = layer.fontSize * 1.3;
            const totalHeight = lineHeight * lines.length;
            const baseX = (width / 2) + layer.posX;
            const baseY = (height / 2) - layer.posY;

            let maxLineWidth = 0;
            lines.forEach((line, index) => {
                const currentY = baseY - (totalHeight / 2) + (index * lineHeight) + (lineHeight / 2);
                ctx.fillText(line, baseX, currentY);
                const textWidth = ctx.measureText(line).width;
                if (textWidth > maxLineWidth) maxLineWidth = textWidth;

                if (layer.isUnderline) {
                    ctx.beginPath(); ctx.strokeStyle = layer.textColor; ctx.lineWidth = Math.max(1.5, layer.fontSize * 0.04);
                    const startXLine = baseX - (textWidth / 2); const underlineY = currentY + (layer.fontSize / 2) * 0.8;
                    ctx.moveTo(startXLine, underlineY); ctx.lineTo(startXLine + textWidth, underlineY); ctx.stroke();
                }
            });

            layer.bounds = {
                minX: baseX - (maxLineWidth / 2),
                maxX: baseX + (maxLineWidth / 2),
                minY: baseY - (totalHeight / 2),
                maxY: baseY + (totalHeight / 2)
            };

            if (isDragging && activeLayerType === 'text' && dragTargetLayer === layer) {
                renderPrecisionGuide(layer.bounds.minX-10, layer.bounds.minY-5, maxLineWidth+20, totalHeight+10, layer.textColor);
            }
            ctx.restore();
        });

        tScene.children.forEach(mesh => { mesh.visible = mesh.position.z >= 5; });
        tRenderer.clear();
        tRenderer.render(tScene, tCamera);
        ctx.drawImage(threeCanvas, 0, 0);

        if (isDragging && activeLayerType === 'shape' && dragTargetLayer) {
            const cx = (width / 2) + dragTargetLayer.posX;
            const cy = (height / 2) - dragTargetLayer.posY;
            const size = dragTargetLayer.radius;
            renderPrecisionGuide(cx - size, cy - size, size * 2, size * 2, dragTargetLayer.color);
        }
    }

    function renderPrecisionGuide(x, y, w, h, color) {
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.strokeRect(x, y, w, h);
        const cross = (cx, cy) => {
            ctx.beginPath(); ctx.moveTo(cx-4, cy); ctx.lineTo(cx+4, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy-4); ctx.lineTo(cx, cy+4); ctx.stroke();
        };
        cross(x, y); cross(x+w, y); cross(x, y+h); cross(x+w, y+h);
        ctx.restore();
    }

    canvasContainer.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        dragTargetLayer = null;

        if (activeLayerType === 'text') {
            for (let i = layers.length - 1; i >= 0; i--) {
                const l = layers[i];
                if (l.visible && l.bounds && clickX >= l.bounds.minX && clickX <= l.bounds.maxX && clickY >= l.bounds.minY && clickY <= l.bounds.maxY) {
                    dragTargetLayer = l; break;
                }
            }
        } else if (activeLayerType === 'shape') {
            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i]; if (!s.visible) continue;
                const sx = (canvas.width / 2) + s.posX;
                const sy = (canvas.height / 2) - s.posY;
                const dist = Math.sqrt((clickX - sx)**2 + (clickY - sy)**2);
                if (dist <= Math.max(s.radius, 40)) { dragTargetLayer = s; break; }
            }
        }

        if (dragTargetLayer) {
            isDragging = true; startX = e.clientX; startY = e.clientY;
            setActiveLayer(activeLayerType, dragTargetLayer.id);
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging || !dragTargetLayer) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const deltaX = (e.clientX - startX) * scaleX;
        const deltaY = (e.clientY - startY) * scaleY;

        dragTargetLayer.posX = Math.round((dragTargetLayer.posX || 0) + deltaX);
        dragTargetLayer.posY = Math.round((dragTargetLayer.posY || 0) - deltaY);

        startX = e.clientX; startY = e.clientY;

        if (activeLayerType === 'text') {
            const item = layerListContainer.querySelector(`[data-id="${dragTargetLayer.id}"]`);
            if (item) { item.querySelector('.layer-x-input').value = dragTargetLayer.posX; item.querySelector('.layer-y-input').value = dragTargetLayer.posY; }
        }
        drawThumbnail();
    });

    window.addEventListener('mouseup', () => {
        if (isDragging && dragTargetLayer) {
            isDragging = false;

            const width = parseInt(canvasWidthInput.value) || 1200;
            const height = parseInt(canvasHeightInput.value) || 630;
            const divX = Math.max(1, parseInt(gridDivXInput.value) || 12);
            const divY = Math.max(1, parseInt(gridDivYInput.value) || 12);
            const stepX = width / divX;
            const stepY = height / divY;

            const absX = (width / 2) + dragTargetLayer.posX;
            const absY = (height / 2) - dragTargetLayer.posY;

            const snappedX = Math.round(absX / stepX) * stepX;
            const snappedY = Math.round(absY / stepY) * stepY;

            dragTargetLayer.posX = Math.round(snappedX - (width / 2));
            dragTargetLayer.posY = Math.round((height / 2) - snappedY);

            dragTargetLayer = null;
            renderLayerList(); renderShapeList(); drawThumbnail(); saveHistory();
        }
    });

    function exportImage(format, extension) {
        isDragging = false; drawThumbnail();
        const link = document.createElement('a');
        let filename = fileNameInput.value.trim() || 'thumbnail';
        link.download = `${filename}.${extension}`;
        link.href = canvas.toDataURL(format, format === 'image/webp' ? 0.9 : undefined);
        link.click();
    }

    downloadWebPBtn.addEventListener('click', () => exportImage('image/webp', 'webp'));
    downloadPNGBtn.addEventListener('click', () => exportImage('image/png', 'png'));

</script>

</body>
