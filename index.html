    function saveHistory() {
        if (historyIndex < historyStack.length - 1) {
            historyStack = historyStack.slice(0, historyIndex + 1);
        }
        historyStack.push({
            layers: JSON.parse(JSON.stringify(layers)),
            shapes: JSON.parse(JSON.stringify(shapes)),
            activeLayerType, activeLayerId,
            canvasWidth: canvasWidthInput.value, canvasHeight: canvasHeightInput.value,

        });
        historyIndex++;
        updateHistoryButtons();
        saveToLocalStorage();
    }

    function restoreHistory(index) {
        if (index < 0 || index >= historyStack.length) return;
        historyIndex = index;
        const snapshot = historyStack[historyIndex];

        layers = JSON.parse(JSON.stringify(snapshot.layers));
        shapes = JSON.parse(JSON.stringify(snapshot.shapes));
        activeLayerType = snapshot.activeLayerType;

    function buildThreeScene() {
        while(tScene.children.length > 0){ tScene.remove(tScene.children[0]); }

        shapes.forEach((shape, idx) => {
            if (!shape.visible) return;
            let geometry;
            const mat = new THREE.MeshBasicMaterial({ color: shape.color, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });

            if (shape.type === 'circle') {
                geometry = new THREE.CircleGeometry(shape.radius, 64);
            } else if (shape.type === 'rect') {
                const s = shape.radius * 2;
                geometry = new THREE.PlaneGeometry(s, s);
            } else if (shape.type === 'sector') {
                const rad = (shape.angle * Math.PI) / 180;
                geometry = new THREE.CircleGeometry(shape.radius, 64, 0, rad);
            } else if (shape.type === 'triangle') {
                const s = shape.radius * 2; const h = s * Math.sqrt(3) / 2;
                const tShape = new THREE.Shape(); tShape.moveTo(0, h/2); tShape.lineTo(-s/2, -h/2); tShape.lineTo(s/2, -h/2); tShape.closePath();
                geometry = new THREE.ShapeGeometry(tShape);
            } else if (shape.type === 'ring') {
                geometry = new THREE.RingGeometry(shape.radius * 0.5, shape.radius, 64);
            } else if (shape.type === 'star') {
                const sShape = new THREE.Shape();
                const outer = shape.radius;
                const inner = shape.radius * 0.4;
                for(let j=0; j<10; j++) {
                    const r = j%2===0 ? outer : inner;
                    const a = (j * Math.PI)/5 - Math.PI/2;
                    if(j===0) sShape.moveTo(r*Math.cos(a), r*Math.sin(a));
                    else sShape.lineTo(r*Math.cos(a), r*Math.sin(a));
                }
                sShape.closePath();
                geometry = new THREE.ShapeGeometry(sShape);
            } else if (shape.type === 'line') {
                const length = shape.radius * 2; const thick = shape.thick || 5;
                const lShape = new THREE.Shape(); lShape.moveTo(0, -thick/2); lShape.lineTo(length, -thick/2); lShape.lineTo(length, thick/2); lShape.lineTo(0, thick/2); lShape.closePath();
                geometry = new THREE.ShapeGeometry(lShape);
            }

            if (geometry) {
                const mesh = new THREE.Mesh(geometry, mat);
                const zPos = (shape.isFront ? 10 : 0) + (idx * 0.01);
                mesh.position.set(shape.posX, shape.posY, zPos);
                if (shape.type === 'line' && shape.angle) mesh.rotation.z = (shape.angle * Math.PI) / 180;
                tScene.add(mesh);
            }
        });
    }

    });

    function toggleShapeVisibility(id, event) {
        event.stopPropagation(); const s = shapes.find(x => x.id === id);
        if(s) { s.visible = !s.visible; renderShapeList(); drawThumbnail(); saveHistory(); }
    }
    function deleteShape(id, event) {
        event.stopPropagation(); shapes = shapes.filter(x => x.id !== id);
        if(activeLayerType === 'shape' && activeLayerId === id) activeLayerId = shapes.length > 0 ? shapes[0].id : 1;
        renderShapeList(); drawThumbnail(); saveHistory();
    }
    function toggleVisibility(id, event) {
        event.stopPropagation(); const l = layers.find(x => x.id === id);
        if(l) { l.visible = !l.visible; renderLayerList(); drawThumbnail(); saveHistory(); }
    }
    function deleteLayer(id, event) {
        event.stopPropagation(); if (layers.length <= 1) return;
        layers = layers.filter(x => x.id !== id);
        if(activeLayerType === 'text' && activeLayerId === id) activeLayerId = layers[0].id;
        renderLayerList(); drawThumbnail(); saveHistory();
    }

    addLayerBtn.addEventListener('click', () => {
        const newId = layers.length > 0 ? Math.max(...layers.map(l => l.id)) + 1 : 1;
        layers.push({ id: newId, text: "NEW NODE ELEMENT", fontFamily: "'Oswald', sans-serif", fontSize: 32, textColor: "#ffffff", isBold: false, isItalic: false, isUnderline: false, posX: 0, posY: 0, visible: true });
        activeLayerType = 'text'; activeLayerId = newId;
        renderLayerList(); drawThumbnail(); saveHistory();
    });

    bgColorInput.addEventListener('input', (e) => { bgColorTextInput.value = e.target.value; drawThumbnail(); });
    bgColorInput.addEventListener('change', () => { saveHistory(); });
    bgColorTextInput.addEventListener('change', (e) => {
        if(/^#[0-9A-F]{6}$/i.test(e.target.value)) {
            bgColorInput.value = e.target.value; drawThumbnail(); saveHistory();
        }
    });

    fileNameInput.addEventListener('change', () => { saveToLocalStorage(); });

    [canvasWidthInput, canvasHeightInput, gridDivXInput, gridDivYInput].forEach(input => {
        input.addEventListener('change', () => { drawThumbnail(); saveHistory(); });
    });

    sizePresetSelect.addEventListener('change', (e) => {
        if (!e.target.value) return;
        const [w, h] = e.target.value.split(',').map(Number);
        if (w && h) {
            canvasWidthInput.value = w;
            canvasHeightInput.value = h;
            drawThumbnail();
            saveHistory();
        }
        e.target.value = ""; // Reset selector
    });

    presetSelect.addEventListener('change', (e) => {
        const presetIndex = parseInt(e.target.value);
        if (isNaN(presetIndex) || !presets[presetIndex]) return;

        if (confirm('プリセットを適用しますか？現在の編集内容は上書きされます。')) {
            const preset = presets[presetIndex];

            layers = JSON.parse(JSON.stringify(preset.layers));
            shapes = JSON.parse(JSON.stringify(preset.shapes));

            canvasWidthInput.value = preset.canvasWidth;
            canvasHeightInput.value = preset.canvasHeight;
            bgColorInput.value = preset.bgColor;
            bgColorTextInput.value = preset.bgColor;
            gridDivXInput.value = preset.gridDivX;
            gridDivYInput.value = preset.gridDivY;

            activeLayerType = 'text';
            activeLayerId = layers.length > 0 ? layers[0].id : null;

            renderLayerList();
            renderShapeList();
            drawThumbnail();
            saveHistory();
        } else {
            e.target.value = "";
        }
    });

    resetBtn.addEventListener('click', () => {
        if (confirm('プロジェクトを初期化しますか？保存されたデータは完全に消去されます。')) {
            localStorage.removeItem('cortadoState');
            location.reload();
        }
    });

    function drawThumbnail() {
        const width = parseInt(canvasWidthInput.value) || 1200;
        const height = parseInt(canvasHeightInput.value) || 630;

        const divX = Math.max(1, parseInt(gridDivXInput.value) || 12);
        const divY = Math.max(1, parseInt(gridDivYInput.value) || 12);
        const stepX = width / divX;
        const stepY = height / divY;

        canvas.width = width;
        canvas.height = height;

        ctx.fillStyle = bgColorInput.value;
        ctx.fillRect(0, 0, width, height);

        buildThreeScene();
        tCamera.left = -width / 2; tCamera.right = width / 2; tCamera.top = height / 2; tCamera.bottom = -height / 2;
        tCamera.updateProjectionMatrix();
        tRenderer.setSize(width, height);

        tScene.children.forEach(mesh => { mesh.visible = mesh.position.z < 5; });
        tRenderer.clear();
        tRenderer.render(tScene, tCamera);
        ctx.drawImage(threeCanvas, 0, 0);

        layers.forEach(layer => {
            if (!layer.visible) return;

            ctx.save();
            let fontStyle = '';
            if (layer.isItalic) fontStyle += 'italic ';
            if (layer.isBold) fontStyle += 'bold ';
            fontStyle += `${layer.fontSize}px ${layer.fontFamily}`;
            ctx.font = fontStyle;
            ctx.fillStyle = layer.textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const lines = layer.text.split('\n');
            const lineHeight = layer.fontSize * 1.3;
            const totalHeight = lineHeight * lines.length;
            const baseX = (width / 2) + layer.posX;
            const baseY = (height / 2) - layer.posY;

            let maxLineWidth = 0;
            lines.forEach((line, index) => {
                const currentY = baseY - (totalHeight / 2) + (index * lineHeight) + (lineHeight / 2);
                ctx.fillText(line, baseX, currentY);
                const textWidth = ctx.measureText(line).width;
                if (textWidth > maxLineWidth) maxLineWidth = textWidth;

                if (layer.isUnderline) {
                    ctx.beginPath(); ctx.strokeStyle = layer.textColor; ctx.lineWidth = Math.max(1.5, layer.fontSize * 0.04);
                    const startXLine = baseX - (textWidth / 2); const underlineY = currentY + (layer.fontSize / 2) * 0.8;
                    ctx.moveTo(startXLine, underlineY); ctx.lineTo(startXLine + textWidth, underlineY); ctx.stroke();
                }
            });

            layer.bounds = {
                minX: baseX - (maxLineWidth / 2),
                maxX: baseX + (maxLineWidth / 2),
                minY: baseY - (totalHeight / 2),
                maxY: baseY + (totalHeight / 2)
            };

            if (isDragging && activeLayerType === 'text' && dragTargetLayer === layer) {
                renderPrecisionGuide(layer.bounds.minX-10, layer.bounds.minY-5, maxLineWidth+20, totalHeight+10, layer.textColor);
            }
            ctx.restore();
        });

        tScene.children.forEach(mesh => { mesh.visible = mesh.position.z >= 5; });
        tRenderer.clear();
        tRenderer.render(tScene, tCamera);
        ctx.drawImage(threeCanvas, 0, 0);

        if (isDragging) {
            ctx.save();
            ctx.strokeStyle = "rgba(148, 163, 184, 0.25)"; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
            for (let i = 1; i < divX; i++) { ctx.beginPath(); ctx.moveTo(i * stepX, 0); ctx.lineTo(i * stepX, height); ctx.stroke(); }
            for (let j = 1; j < divY; j++) { ctx.beginPath(); ctx.moveTo(0, j * stepY); ctx.lineTo(width, j * stepY); ctx.stroke(); }
            ctx.restore();
        }

        if (isDragging && activeLayerType === 'shape' && dragTargetLayer) {
            const cx = (width / 2) + dragTargetLayer.posX;
            const cy = (height / 2) - dragTargetLayer.posY;
            const size = dragTargetLayer.radius;
            renderPrecisionGuide(cx - size, cy - size, size * 2, size * 2, dragTargetLayer.color);
        }
    }

    function renderPrecisionGuide(x, y, w, h, color) {
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.strokeRect(x, y, w, h);
        const cross = (cx, cy) => {
            ctx.beginPath(); ctx.moveTo(cx-4, cy); ctx.lineTo(cx+4, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy-4); ctx.lineTo(cx, cy+4); ctx.stroke();
        };
        cross(x, y); cross(x+w, y); cross(x, y+h); cross(x+w, y+h);
        ctx.restore();
    }

    canvasContainer.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        dragTargetLayer = null;

        if (activeLayerType === 'text') {
            for (let i = layers.length - 1; i >= 0; i--) {
                const l = layers[i];
                if (l.visible && l.bounds && clickX >= l.bounds.minX && clickX <= l.bounds.maxX && clickY >= l.bounds.minY && clickY <= l.bounds.maxY) {
                    dragTargetLayer = l; break;
                }
            }
        } else if (activeLayerType === 'shape') {
            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i]; if (!s.visible) continue;
                const sx = (canvas.width / 2) + s.posX;
                const sy = (canvas.height / 2) - s.posY;
                const dist = Math.sqrt((clickX - sx)**2 + (clickY - sy)**2);
                if (dist <= Math.max(s.radius, 40)) { dragTargetLayer = s; break; }
            }
        }

        if (dragTargetLayer) {
            isDragging = true; startX = e.clientX; startY = e.clientY;
            setActiveLayer(activeLayerType, dragTargetLayer.id);
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging || !dragTargetLayer) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const deltaX = (e.clientX - startX) * scaleX;
        const deltaY = (e.clientY - startY) * scaleY;

        dragTargetLayer.posX = Math.round((dragTargetLayer.posX || 0) + deltaX);
        dragTargetLayer.posY = Math.round((dragTargetLayer.posY || 0) - deltaY);

        startX = e.clientX; startY = e.clientY;

        if (activeLayerType === 'text') {
            const item = layerListContainer.querySelector(`[data-id="${dragTargetLayer.id}"]`);
            if (item) { item.querySelector('.layer-x-input').value = dragTargetLayer.posX; item.querySelector('.layer-y-input').value = dragTargetLayer.posY; }
        }
        drawThumbnail();
    });

    window.addEventListener('mouseup', () => {
        if (isDragging && dragTargetLayer) {
            isDragging = false;

            const width = parseInt(canvasWidthInput.value) || 1200;
            const height = parseInt(canvasHeightInput.value) || 630;
            const divX = Math.max(1, parseInt(gridDivXInput.value) || 12);
            const divY = Math.max(1, parseInt(gridDivYInput.value) || 12);
            const stepX = width / divX;
            const stepY = height / divY;

            const absX = (width / 2) + dragTargetLayer.posX;
            const absY = (height / 2) - dragTargetLayer.posY;

            const snappedX = Math.round(absX / stepX) * stepX;
            const snappedY = Math.round(absY / stepY) * stepY;

            dragTargetLayer.posX = Math.round(snappedX - (width / 2));
            dragTargetLayer.posY = Math.round((height / 2) - snappedY);

            dragTargetLayer = null;
            renderLayerList(); renderShapeList(); drawThumbnail(); saveHistory();
        }
    });

    function exportImage(format, extension) {
        isDragging = false; drawThumbnail();
        const link = document.createElement('a');
        let filename = fileNameInput.value.trim() || 'thumbnail';
        link.download = `${filename}.${extension}`;
        link.href = canvas.toDataURL(format, format === 'image/webp' ? 0.9 : undefined);
        link.click();
    }

    downloadWebPBtn.addEventListener('click', () => exportImage('image/webp', 'webp'));
    downloadPNGBtn.addEventListener('click', () => exportImage('image/png', 'png'));

</script>

</body>
